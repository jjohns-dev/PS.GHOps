name: ci
run-name: ci

on:
  pull_request:
    branches: ["*"]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    uses: jjohns-dev/pwsh-module-ci/.github/workflows/ci.yml@feat/9-polymorphic-os-matrix
    with:
      os-matrix: '[{"os":"ubuntu-latest","minTests":91},{"os":"windows-latest","minTests":99999},{"os":"macos-latest","minTests":91}]'
    permissions:
      contents: read
      checks: write
