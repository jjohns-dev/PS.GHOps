name: ci
run-name: ci

on:
  pull_request:
    branches: ["*"]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    uses: jjohns-dev/pwsh-module-ci/.github/workflows/ci.yml@v2
    with:
      # All three legs collect the same count, so one flat floor covers them.
      min-tests: 106 # 111 executed - min(floor(111 * 0.05), 10) = 111 - 5
    permissions:
      contents: read
      checks: write
