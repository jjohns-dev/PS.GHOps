name: ci
run-name: ci

on:
  pull_request:
    branches: ["*"]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    uses: jjohns-dev/pwsh-module-ci/.github/workflows/ci.yml@v2
    with:
      # Both legs collect the same count, so one flat floor covers them.
      min-tests: 145 # 152 executed - min(floor(152 * 0.05), 10) = 152 - 7
      os-matrix: '["ubuntu-latest", "windows-latest"]'
    permissions:
      contents: read
      checks: write
