name: release
run-name: release ${{ github.ref_name }}

on:
  pull_request:
    branches: ["*"]
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+" # v0.1.0
      #- "v[0-9]+.[0-9]+.[0-9]+-rc[0-9]+" # v0.1.0-rc01

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: jjohns-dev/pwsh-module-ci/.github/workflows/release.yml@a3e5f5cea513381634f211ac3b9208cbe1245fff # C5 test
    with:
      artifact-name: ${{ github.event_name == 'pull_request' && 'PS.GHOps-dry-run' || format('PS.GHOps-{0}', github.ref_name) }}
      dry-run: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: write
